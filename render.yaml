services:
  # Main web app
  - type: web
    name: fileconverter
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fileconverter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fileconverter-redis
          type: redis
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /tmp/fileconverter
      - key: SITE_URL
        value: https://fileconverter.onrender.com  # update to your actual domain
    healthCheckPath: /health

  # Celery worker
  - type: worker
    name: fileconverter-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    startCommand: celery -A app.services.tasks.celery worker --loglevel=info
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fileconverter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fileconverter-redis
          type: redis
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /tmp/fileconverter

databases:
  - name: fileconverter-db
    plan: free
    databaseName: fileconverter
    user: fileconverter

  - name: fileconverter-redis
    plan: free
    type: redis
