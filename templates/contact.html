{% extends 'base.html' %}
{% block content %}
<div class="content-page container">
  <div class="contact-wrap">
    <h1>Contact Us</h1>
    <p>Have a question, feedback, or need help with a conversion? We're here to help.</p>
    
    <div class="contact-grid">
      <div class="contact-form-wrap">
        <form action="#" class="contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email address" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
      <div class="contact-info">
        <h3>Other ways to reach us</h3>
        <p><strong>Email:</strong> support@converterhub.com</p>
        <p><strong>Social:</strong> @ConverterHub</p>
        <p><strong>Location:</strong> Built with ❤️ by the open-source community.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
